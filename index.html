/* Layout: single column, follows the phone theme; a tile map of where money goes opens the page, details follow in order of size; figures in a condensed till-display face */
:root{
  --bg:#0E1113; --surface:#171B1E; --raise:#1E2327; --soft:#262C30; --ink:#EEF2F0; --muted:#8D979D; --line:#262C30;
  --accent:#B39BFF; --onAccent:#120B26; --pos:#4CC27A; --neg:#F06A5A; --warn:#F2B63D;
  --tWarn:rgba(242,182,61,.14); --tPos:rgba(76,194,122,.15); --tNeg:rgba(240,106,90,.15); --band:rgba(242,182,61,.17);
  --k-groceries:#2BB5A0; --k-cafe:#F07A5E; --k-delivery:#F2A03D; --k-coffee:#C9935E; --k-taxi:#F2C230; --k-home:#5B92F5;
  --k-phone:#46B7E0; --k-subs:#7C8CF4; --k-beauty:#F28DB8; --k-health:#7CC75B; --k-shopping:#B784F2; --k-sport:#B8D24A;
  --k-fun:#F05C8E; --k-travel:#4FC6C6; --k-gifts:#E5B07D; --k-family:#F2A7C3; --k-people:#C2AD86; --k-cash:#8399AC; --k-fees:#77838B; --k-other:#7F8A91; --k-rest:#97A7B0;
  --tile-ink:#0B0E10;
  --f-num:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EDF0EE; --surface:#FFFFFF; --raise:#F6F8F7; --soft:#E2E7E4; --ink:#121816; --muted:#5E696F; --line:#DCE2DF;
  --accent:#6247D6; --onAccent:#FFFFFF; --pos:#24804A; --neg:#C2402E; --warn:#B07B00;
  --tWarn:rgba(176,123,0,.12); --tPos:rgba(36,128,74,.11); --tNeg:rgba(194,64,46,.10); --band:rgba(176,123,0,.09); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EDF0EE; --surface:#FFFFFF; --raise:#F6F8F7; --soft:#E2E7E4; --ink:#121816; --muted:#5E696F; --line:#DCE2DF;
  --accent:#6247D6; --onAccent:#FFFFFF; --pos:#24804A; --neg:#C2402E; --warn:#B07B00;
  --tWarn:rgba(176,123,0,.12); --tPos:rgba(36,128,74,.11); --tNeg:rgba(194,64,46,.10); --band:rgba(176,123,0,.09); color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
.small{font-size:13.5px;color:var(--muted)}

/* header + period */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 10px}
.head h1{font:600 30px/1 var(--f-num);margin:0;letter-spacing:.2px}
.head h1.cap{text-transform:capitalize}
.mon{display:flex;align-items:center;gap:8px;min-width:0}
.mon .ar{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px;display:grid;place-items:center;flex:none}
.mon .ar:disabled{opacity:.3}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.iconbtn i.ok{background:var(--pos)}.iconbtn i.syncing{background:var(--warn)}.iconbtn i.error{background:var(--neg)}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.seg button.on{background:var(--soft);color:var(--ink)}

/* hero */
.hero{padding-block:18px 6px}
.hero .lbl{font-size:14px;color:var(--muted)}
.hero .big{font:700 64px/0.95 var(--f-num);font-variant-numeric:tabular-nums;margin:6px 0 8px;letter-spacing:-.5px}
.hero .big small{font-size:32px;font-weight:600;margin-left:5px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font:600 18px/1 var(--f-num);font-variant-numeric:tabular-nums;margin-right:3px}

/* treemap */
.tmap{position:relative;width:100%;aspect-ratio:5/4;max-width:100%;margin-top:14px;border-radius:16px;overflow:hidden;background:var(--surface)}
.tile{position:absolute;padding:8px 9px;color:var(--tile-ink);border:2px solid var(--bg);border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-align:left}
.tile b{font:600 13.5px/1.15 var(--f-body);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .v{font:700 24px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .p{font:500 12px var(--f-body);opacity:.75}
.tile.m{padding:6px 7px}.tile.m .v{font-size:18px}.tile.m b{font-size:12px}
.tile.s{padding:4px 5px}.tile.s .v{font-size:14px}.tile.s b{font-size:11px}
.tile.xs{padding:3px}.tile.vo{padding:4px 5px;justify-content:flex-end}.tile.vo .v{font-size:14px}

/* need / flex */
.nf{margin-top:14px;background:var(--surface);border-radius:16px;padding:14px 16px}
.nf .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:3px;margin:10px 0 10px}
.nf .bar i{display:block;height:100%}
.nf .row2{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.nf .row2 b{display:block;color:var(--ink);font:600 22px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.nf .row2 div:last-child{text-align:right}

.review{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--tWarn);border-radius:14px;padding:13px 16px;margin-top:14px;font-weight:600}
.review span{color:var(--muted);font-weight:500;font-size:14px}

/* ---------- text helpers ---------- */
function stripLoc(s){
  let p;do{p=s;s=s.replace(/\s+(KZ|UZ|UZB|KAZ)\s*$/,'').replace(/\s+(ASTANA|ALMATY|ATYRAU|AKTOBE|NUR-? ?SULTAN|SHYMKENT|KARAGANDA|TASHKENT|TOSHKENT|ТАШКЕНТ|SAMARKAND|SAMARQAND|BUKHARA|BUXORO)\s*$/,'').replace(/\s+\*?\d{3,}\s*$/,'').trim();}while(s!==p);
  return s;
}
function keyOf(desc){
  let s=normK(desc).toUpperCase().replace(/["«»']/g,'');
  let q;do{q=s;s=s.replace(/^(IP|ИП|ТОО|TOO|MCHJ|OOO|ООО|XK|ЧП|YATT|LLC|SP)\s+/,'');}while(q!==s);s=s.replace(/\s+(MCHJ|OOO|ООО|XK|LLC)$/,'');

}
const PERSON=/^[A-ZА-ЯЁӘҒҚҢӨҰҮҺІ][a-zа-яёәғқңөұүһі\-]+ [A-ZА-ЯЁӘҒҚҢӨҰҮҺІ]\.$/;

function prettyName(tx){
  const d=normK(tx.desc),K=keyOf(d);
  for(const [re,,al] of MERCH)if(al&&re.test(K))return al;
  if(isPerson(d))return d;
  if(/ВКЛАД|ДЕПОЗИТ/i.test(d))return 'Депозит';
  if(/ЗАРПЛАТА/i.test(d))return 'Зарплата';
  let s=K.replace(/\.[A-Z0-9-]+\.?(\s|$)/g,' ').trim();
  s=s.toLowerCase().replace(/(^|[\s\-.])([a-zа-яёәғқңөұүһі])/g,(m,a,b)=>a+b.toUpperCase());
  return s.length>34?s.slice(0,32)+'…':s;
}

/* ---------- amounts and dates ---------- */
const AMT=/^([+-])\s*([\d\s .,]+)\s*₸?$/;
function parseAmt(str){
  const s=str.replace(/₸/g,'').trim();const m=s.match(/^([+-])\s*([\d\s .,]+)$/);if(!m)return null;
  let n=m[2].replace(/[\s ]/g,'');
  if(n.includes(',')&&n.includes('.'))n=n.replace(/,/g,'');else n=n.replace(',','.');
  const v=parseFloat(n);if(isNaN(v))return null;return (m[1]==='-'?-1:1)*v;
}
const DATE=/^(\d{2})\.(\d{2})\.(\d{2}|\d{4})$/;
function parseDate(s){const m=s.match(DATE);if(!m)return null;const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2]+'-'+m[1];}

/* ---------- statement parser ----------
   pages: [{h, items:[{x,y,w,str}]}] with y measured from top */
const OPWORDS=/^(Покупка|Перевод|Пополнение|Снятие|Разное|Поступление со|своего счета|Перевод на свой|счет|Сумма в|обработке|Платеж|Другое|Погашение|Овердрафт|Платеж по кредиту)$/;
function parseStatement(pages){
  const all=pages.map(p=>p.items.map(i=>i.str).join(' ')).join(' ');
  const bank=/Kaspi Gold|Kaspi Bank/i.test(all)?'kaspi':/Freedom|Фридом|Super Card/i.test(all)?'freedom':null;
  if(!bank)return {error:'Не похоже на выписку Каспи или Фридом'};
  const pm=all.match(/за период с (\d{2}\.\d{2}\.\d{2,4}) по (\d{2}\.\d{2}\.\d{2,4})/);
  const period=pm?[parseDate(pm[1]),parseDate(pm[2])]:null;
  let open=null,close=null;
  if(bank==='kaspi'){
    const o=all.match(/Доступно на (\d{2}\.\d{2}\.\d{2})\s+([+-]\s*[\d\s ]+,\d{2})\s*₸/g);
    if(o&&o.length){const vals=o.map(x=>{const mm=x.match(/Доступно на (\S+)\s+(.+?)\s*₸/);return {d:parseDate(mm[1]),v:parseAmt(mm[2])};});
      if(period){const a=vals.find(v=>v.d===period[0]);const b=vals.find(v=>v.d===period[1]);if(a)open=a.v;if(b)close=b.v;}}
  }
  const rows=[];let carry=[];let lay=null;
  pages.forEach(pg=>{
    const its=pg.items.filter(i=>i.str&&i.str.trim()).map(i=>Object.assign({},i,{str:normK(i.str)}));
    const hd=its.find(i=>i.str==='Детали'),hop=its.find(i=>i.str==='Операция'&&hd&&Math.abs(i.y-hd.y)<4);
    let hy;
    if(hd&&hop){lay={opX:hop.x};hy=hd.y;}
    else if(lay){hy=-1;}
    else return;
    const body0=its.filter(i=>i.y>hy+3&&i.y<pg.h-60);
    const dates0=body0.filter(i=>DATE.test(i.str)&&i.x<lay.opX-40).sort((a,b)=>a.y-b.y);
    if(!dates0.length)return;
    const body=body0.filter(i=>i.y>=dates0[0].y-30);
    const dates=dates0;
    if(!dates.length)return;
    const dateRight=Math.max(...dates.map(d=>d.x+d.w));
    /* details column start: smallest x of non-op, non-amount, non-currency text right of amount */
    let detX=Infinity;
    body.forEach(i=>{if(i.x<=dateRight+5)return;if(AMT.test(i.str)&&/\d/.test(i.str))return;if(/^\(/.test(i.str))return;if(/^(KZT|USD|EUR|RUB)$/.test(i.str))return;if(OPWORDS.test(i.str))return;detX=Math.min(detX,i.x);});
    let stopY=Infinity;
    if(bank==='kaspi'){const t=body.filter(i=>i.x<dateRight&&!DATE.test(i.str)&&i.y>dates[0].y).sort((a,b)=>a.y-b.y)[0];if(t)stopY=t.y;}
    const R=dates.filter(d=>d.y<stopY).map(d=>({date:parseDate(d.str),y:d.y,amt:[],op:[],det:[]}));
    const orphans=[];
    body.forEach(i=>{
      if(DATE.test(i.str)&&i.x<dateRight)return;
      if(i.y>=stopY-1)return;
      let r=null;
      if(bank==='kaspi'){for(const rr of R){if(rr.y<=i.y+3)r=rr;}if(r&&i.y-r.y>45)r=null;}
      else{let best=1e9;R.forEach(rr=>{const dy=Math.abs(rr.y-i.y);if(dy<best){best=dy;r=rr;}});if(best>32)r=null;
        if(r&&r===R[R.length-1]&&i.y>r.y+1){
          const up=body.filter(q=>q!==i&&q.y<r.y-1&&q.y>r.y-32&&!(DATE.test(q.str)&&q.x<dateRight)&&(R.length<2||Math.abs(q.y-r.y)<Math.abs(q.y-R[R.length-2].y)));
          const h=up.length?r.y-Math.min(...up.map(q=>q.y)):0;
          if(i.y-r.y>h+6)r=null;}}
      if(!r){if(i.x>=detX-2)orphans.push(i);return;}
      if(i.x>=detX-2)r.det.push(i);
      else if(/^\(/.test(i.str)||/^(KZT|USD|EUR|RUB)$/.test(i.str))return;
      else if(AMT.test(i.str)&&/\d/.test(i.str)&&!r.amt.length)r.amt.push(i);
      else if(AMT.test(i.str)&&/\d/.test(i.str))return;
      else r.op.push(i);
    });
    const firstY=R.length?R[0].y:0;
    R.forEach((r,ix)=>{
      const sortY=a=>a.slice().sort((p,q)=>p.y-q.y||p.x-q.x).map(i=>i.str).join(' ');
      let det=sortY(r.det);
      if(ix===0&&carry.length){det=carry.map(i=>i.str).join(' ')+' '+det;carry=[];}
      const a=r.amt.length?parseAmt(r.amt[0].str):null;
      if(a==null)return;
      rows.push({bank,date:r.date,a:Math.round(a*100)/100,op:sortY(r.op).replace(/\s+/g,' ').trim(),desc:det.replace(/\s+/g,' ').trim()});
    });
    const lastY=R.length?R[R.length-1].y:0;
    carry=orphans.filter(i=>i.y>lastY).sort((p,q)=>p.y-q.y);
    void firstY;
  });
  rows.forEach(r=>{
    if(/^Сумма в обработке/.test(r.op)){r.pend=true;r.op='Покупка';}
  });
  /* occurrence index for stable ids */
  const occ={};
  rows.forEach(r=>{const k=r.bank+'|'+r.date+'|'+r.a+'|'+r.desc;occ[k]=(occ[k]||0)+1;r.id=hash(k+'|'+occ[k]);});
  const sum=rows.reduce((s,r)=>s+r.a,0);
  let check=null;
  if(bank==='kaspi'){
    const re=/(Пополнения|Поступления со своих счетов|Зачисления кредитов|Переводы на свои счета|Переводы|Покупки|Снятия|Разное)\s+([+-]\s*[\d\s\u00a0]+,\d{2})\s*₸/g;
    let m,tot=0,n=0;const seen={};
    while((m=re.exec(all))){if(seen[m[1]])continue;seen[m[1]]=1;tot+=parseAmt(m[2]);n++;}
    if(n)check={ok:Math.abs(tot-sum)<0.02,expected:Math.round(tot*100)/100,got:Math.round(sum*100)/100};
  }
  return {bank,period,rows,check};
}
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return 't'+h.toString(36);}
/* ---------- Kapitalbank (Uzbekistan) card statement ---------- */
function cleanKapital(raw){
  let d=normK(raw),m,op='',desc='',when=null;
  const za=d.match(/за (\d{2}\.\d{2}\.\d{4})/);if(za)when=parseDate(za[1]);
  if((m=d.match(/^Списание по операциям покупке (.+?)(?: SLIP No| NONE|$)/i))){op='Покупка';desc=m[1];}
  else if((m=d.match(/^Возврат списания (.+?)(?: SLIP No|$)/i))){op='Возврат';desc=m[1];}
  else if((m=d.match(/^Списание по выд\.? нал\.? в АТМ (.+?)(?: SLIP No| DN|$)/i))){op='Снятие';desc='Банкомат '+m[1];}
  else if(/KB на ACCOUNT/i.test(d)){op='Перевод на свой';desc='Перевод на свой счёт';}
  else if((m=d.match(/KB на (UZCARD|HUMO|VISA|MASTERCARD)\S*( UZS| USD)?( KB| другого банка)/i))){op='Перевод';desc='Перевод на '+m[1].toUpperCase()+(m[3].trim()==='KB'?' Капиталбанк':' другого банка');}
  else if(/^Зачисление по опер переводам/i.test(d)){op='Пополнение';desc='Входящий перевод P2P';}
  else if((m=d.match(/^(Заработная плата|Аванс)[^.]*\./i))){op='Зарплата';desc=m[0].replace(/\.$/,'');}
  else{op='';desc=d.replace(/Номер карты:.*$/,'').replace(/ПК:.*$/,'');}
  desc=desc.replace(/\d{6}\*+\d{4}/g,'').replace(/\d{16,}/g,'').replace(/\s+/g,' ').trim().slice(0,60);
  return {op,desc,when};
}
function parseKapital(pages){
  const rows=[];let period=null,stop=false;
  pages.forEach(pg=>{
    if(stop)return;
    const its=pg.items.filter(i=>i.str&&i.str.trim()).map(i=>Object.assign({},i,{str:normK(i.str)}));
    if(!period){const t=its.map(i=>i.str).join(' ');const pm=t.match(/с (\d{2}\.\d{2}\.\d{4}) год по (\d{2}\.\d{2}\.\d{4})/);if(pm)period=[parseDate(pm[1]),parseDate(pm[2])];}
    const hd=its.find(i=>i.str==='Детали операции');if(!hd)return;
    const gen=its.find(i=>/^Дата и время генерации/.test(i.str));
    const endY=gen?gen.y:Math.min(pg.h-90,...its.filter(i=>/^(Онлайн проверка|Управляющий директор)/.test(i.str)).map(i=>i.y));
    if(gen)stop=true;
    const body=its.filter(i=>i.y>hd.y+6&&i.y<endY-2);
    const dates=body.filter(i=>i.x<hd.x-60&&/^\d{2}\.\d{2}\.\d{4}$/.test(i.str)).sort((a,b)=>a.y-b.y);
    dates.forEach((dt,k)=>{
      const top=dt.y-8,bot=k+1<dates.length?dates[k+1].y-8:endY;
      const amtS=body.filter(i=>i.x>dt.x+dt.w&&i.x<hd.x-5&&Math.abs(i.y-dt.y)<3).sort((a,b)=>a.x-b.x).map(i=>i.str).join('').replace(/\s/g,'');
      const a=parseFloat(amtS.replace(/\./g,'').replace(',','.'));if(!isFinite(a)||!a)return;
      const det=body.filter(i=>i.x>=hd.x-5&&i.y>=top&&i.y<bot).sort((a,b)=>a.y-b.y||a.x-b.x).map(i=>i.str).join(' ');
      const c=cleanKapital(det),posted=parseDate(dt.str);
      rows.push({bank:'Kapitalbank',date:c.when&&c.when<=posted&&dd2(c.when,posted)<=10?c.when:posted,a:Math.round(a*100)/100,cur:'UZS',op:c.op,desc:c.desc||'Без описания'});
    });
  });
  const occ={};rows.forEach(r=>{const k=r.bank+'|'+r.date+'|'+r.a+'|'+r.desc;occ[k]=(occ[k]||0)+1;r.id=hash(k+'|'+occ[k]);});
  if(!period&&rows.length){const ds=rows.map(r=>r.date).sort();period=[ds[0],ds[ds.length-1]];}
  if(period&&rows.length){const ds=rows.map(r=>r.date).sort();if(ds[0]<period[0])period[0]=ds[0];}

}
function dd2(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5);}

/* ---------- classification ---------- */
function classify(tx,rules,settings){
  const d=normK(tx.desc),K=keyOf(d),op=tx.op||'',du=d.toUpperCase();
  const own=((settings&&settings.ownNames)||[]).filter(Boolean);
  if(/^Поступление со|^Перевод на свой/.test(op))return {cat:'internal'};
  if(/вклад|депозит|omonat|deposit/i.test(d))return {cat:'internal'};
  if(/конвертац|обмен валют|конверсия|conversion|currency exchange|valyuta ayirboshlash/i.test(d+' '+op))return {cat:'internal'};
  if(own.some(n=>du.includes(n.toUpperCase())))return {cat:'internal'};
  const pk=personKey(tx),rk=pk||K;
  const rule=GENERIC.test(K)&&!pk?null:findRule(rules,rk,pk);
  if(rule&&CAT[rule.cat])return {cat:rule.cat};
  if(tx.ai==='internal')return {cat:'internal'};
  if(/зарплат|zarplata|ish haqi|salary|payroll/i.test(d))return {cat:'salary'};
  if(op==='Зарплата')return {cat:'salary'};
  if(op==='Возврат')return {cat:'inother'};
  if(op==='Перевод'&&/^Перевод на (UZCARD|HUMO)/.test(d))return {cat:'people',rv:true};
  if(op==='Перевод'&&/^Перевод на (VISA|MASTERCARD)/.test(d))return {cat:'people',rv:true};
  if(op==='Снятие'||/BANKOMAT|БАНКОМАТ|\bATM\b|НАЛИЧН|NAQD/.test(du))return {cat:'cash'};
  if(/КОМИССИЯ|COMMISSION|KOMISSIYA|\bFEE\b/.test(du)||op==='Разное')return {cat:'fees'};
  if(tx.a<0)for(const [re,cat] of MERCH)if(re.test(K))return {cat};
  if(tx.ai&&CAT[tx.ai])return {cat:tx.ai,rv:tx.sure===false};
  if(pk){if(tx.a<0)return {cat:'people',rv:true};return {cat:'inother',rv:true};}
  if(/Возврат|Отмена|refund|qaytarish/i.test(d))return {cat:'inother'};
  if(tx.a>0)return {cat:'inother',rv:true};
  return {cat:'other',rv:true};
}
function personKey(tx){const d=normK(tx.desc);return isPerson(d)?d:null;}
/* transfers the bank shows without a name: one key for many different people, so no rule may be learned from them */
const GENERIC=/^(ПЕРЕВОД НА (UZCARD|HUMO|VISA|MASTERCARD)|ВХОДЯЩИЙ ПЕРЕВОД|ПЕРЕВОД С КАРТЫ НА КАРТУ|ПЕРЕВОД НА СВОЙ|БЕЗ ОПИСАНИЯ)/;
function isGeneric(tx){return !personKey(tx)&&GENERIC.test(keyOf(tx.desc));}
const isGenericKey=k=>GENERIC.test(String(k||''));
function findRule(rules,k,isP){
  if(!rules)return null;if(rules[k])return rules[k];if(isP)return null;
  for(const rk in rules){if(rules[rk].person)continue;if(k.startsWith(rk+' ')||rk.startsWith(k+' ')||k===rk)return rules[rk];}
  return null;
}
function ruleKey(tx){return personKey(tx)||keyOf(tx.desc);}
return {CATS,CAT,setCustom,isGeneric,isGenericKey,parseStatement,parseKapital,classify,ruleKey,personKey,keyOf,prettyName,normK,isPerson,parseAmt,parseDate,hash};
})();

/* ---------- treemap ---------- */
function squarify(items,W,H){
  const total=items.reduce((s,i)=>s+i.v,0)||1,scale=W*H/total;
  const nodes=items.map(i=>Object.assign({},i,{area:i.v*scale}));
  const out=[];let x=0,y=0,w=W,h=H,row=[];
  const worst=(r,side)=>{if(!r.length)return Infinity;const s=r.reduce((a,n)=>a+n.area,0),mx=Math.max(...r.map(n=>n.area)),mn=Math.min(...r.map(n=>n.area));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));};
  const place=r=>{const s=r.reduce((a,n)=>a+n.area,0);
    if(w>=h){const cw=s/h;let yy=y;r.forEach(n=>{const hh=n.area/cw;out.push(Object.assign(n,{x,y:yy,w:cw,h:hh}));yy+=hh;});x+=cw;w-=cw;}
    else{const rh=s/w;let xx=x;r.forEach(n=>{const ww=n.area/rh;out.push(Object.assign(n,{x:xx,y,w:ww,h:rh}));xx+=ww;});y+=rh;h-=rh;}};
  const rest=nodes.slice();
  while(rest.length){const side=Math.min(w,h),c=rest[0];if(worst(row.concat(c),side)<=worst(row,side)){row.push(c);rest.shift();}else{place(row);row=[];}}
  if(row.length)place(row);return out;
}
function treemapHTML(st){
  const W=1000,H=800;if(!st.order.length)return '';
  const big=[],rest=[];st.order.forEach(c=>(st.by[c]/st.spend<0.03?rest:big).push(c));
  const items=big.map(c=>({c,v:st.by[c]}));
  if(rest.length===1)items.push({c:rest[0],v:st.by[rest[0]]});else if(rest.length)items.push({c:'_rest',v:rest.reduce((x,c)=>x+st.by[c],0),n:rest.length});
  return `<div class="tmap" role="img" aria-label="Траты по категориям">${squarify(items,W,H).map(r=>{
    const pc=Math.round(r.v/st.spend*100);
    const cls=r.w>=320&&r.h>=250?'':r.w>=230&&r.h>=170?'m':r.w>=150&&r.h>=135?'s':r.w>=130&&r.h>=60?'vo':'xs';
    const isRest=r.c==='_rest',name=isRest?`Ещё ${r.n} ${pl(r.n,'категория','категории','категорий')}`:catName(r.c);
    return `<button class="tile ${cls}" data-act="${isRest?'toCats':'cat'}" data-v="${r.c}" style="left:${r.x/10}%;top:${r.y/8}%;width:${r.w/10}%;height:${r.h/8}%;background:${col(r.c)}" aria-label="${esc(name)}: ${money(r.v)} ${SYMM()}">${cls==='xs'?'':cls==='vo'?`<span class="v">${moneyC(r.v)}</span>`:`<b>${esc(name)}</b><span><span class="v">${moneyC(r.v)}</span>${cls?'':` <span class="p">${pc}%</span>`}</span>`}</button>`;}).join('')}</div>`;
}

  if(per==='month'){const m=curMonth(),dim=Number(monthEnd(m).slice(8)),full=st.b>=monthEnd(m);exp=g*st.days/dim;proj=full?spent:spent/st.days*dim;}else pg=g*st.days/30;

function curUsed(){const u={};allTx().forEach(t=>{if(t.cur&&t.cur!==MAIN())u[t.cur]=1;});return u;}
function daysChart(st){

  if(!long){for(let d=st.a;d<=st.b;d=ymd(addD(pd(d),1)))pts.push({d,v:st.perDay[d]||0,band:isWknd(d)});}
  else{let wk=null;for(let d=st.a;d<=st.b;d=ymd(addD(pd(d),1))){if(!wk||pd(d).getDay()===1){wk={d,v:0,band:false};pts.push(wk);}wk.v+=st.perDay[d]||0;}}
  const W=340,H=150,L=8,R=8,T=18,B=22,n=pts.length,bw=(W-L-R)/n,mx=Math.max(1,...pts.map(p=>p.v));
  const avg=st.spend/(long?pts.length:st.days),Y=v=>T+(1-v/mx)*(H-T-B),top=pts.reduce((x,p)=>p.v>x.v?p:x,pts[0]);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Траты по ${long?'неделям':'дням'}">`;
  pts.forEach((p,i)=>{if(p.band)svg+=`<rect x="${L+i*bw}" y="${T-6}" width="${bw}" height="${H-B-T+6}" fill="var(--band)"/>`;});
  pts.forEach((p,i)=>{const h=Math.max(p.v?2:0,(H-T-B)-(Y(p.v)-T));svg+=`<rect class="bar" data-act="day" data-v="${long?'':p.d}" x="${L+i*bw+bw*0.15}" y="${H-B-h}" width="${bw*0.7}" height="${h}" rx="${Math.min(3,bw*0.2)}" fill="${p===top?'var(--warn)':'var(--accent)'}"><title>${fDs(p.d)}: ${money(p.v)}</title></rect>`;});
  svg+=`<line x1="${L}" x2="${W-R}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
  const ti=pts.indexOf(top);svg+=`<text x="${Math.min(W-R-24,Math.max(L+24,L+ti*bw+bw/2))}" y="${Math.max(11,Y(top.v)-5)}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">${money(top.v)}</text>`;
  [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{svg+=`<text x="${Math.min(W-R-14,Math.max(L+14,L+i*bw+bw/2))}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${fDs(pts[i].d)}</text>`;});
  return svg+'</svg>';
}

function prevStats(st){
  if(per==='month'){const ms=months(),i=ms.indexOf(curMonth());if(i<1)return null;const r=coverage(ms[i-1]);return {s:stats(r[0],r[1]),lbl:'в '+MONp[Number(ms[i-1].slice(5))-1]};}

  const a=pa<firstDate()?firstDate():pa;return {s:stats(a,pb),lbl:'в прошлые '+st.days+' '+pl(st.days,'день','дня','дней')};
}
const pct=x=>Math.round(Math.abs(x)*100)+'%';
function insights(st){
  const U=SYMM(),out=[];if(!st.spend)return out;
  const P=prevStats(st),ps=P&&P.s&&P.s.spend>0&&P.s.days>=7&&st.days>=4?P.s:null;
  if(ps){const now=st.spend/st.days,was=ps.spend/ps.days,ch=now/was-1;
    out.push(Math.abs(ch)<0.08?`Темп как ${P.lbl}: <b>${money(now)}${NBSP}${U}</b> в день.`:`В день выходит <b>${money(now)}${NBSP}${U}</b>, это на ${pct(ch)} ${ch>0?'больше':'меньше'}, чем ${P.lbl} (${money(was)}).`);
    const diff=CATS.filter(c=>c.kind==='spend').map(c=>({c:c.id,d:(st.by[c.id]||0)-(ps.by[c.id]||0)/ps.days*st.days})).filter(x=>Math.abs(x.d)>=Math.max(st.spend*0.05,1));
    const up=diff.filter(x=>x.d>0).sort((a,b)=>b.d-a.d)[0],dn=diff.filter(x=>x.d<0).sort((a,b)=>a.d-b.d)[0];
    if(up)out.push(`Больше обычного ушло на <b>${esc(catName(up.c).toLowerCase())}</b>: на ${money(up.d)}${NBSP}${U} выше, чем было бы в темпе ${P.lbl.replace(/^в /,'')}.`);
    if(dn)out.push(`Меньше обычного: <b>${esc(catName(dn.c).toLowerCase())}</b>, на ${money(-dn.d)}${NBSP}${U}.`);
  }
  const fam=st.by.family||0;
  if(fam>0){const R=Object.values(st.merch.family||{}).sort((a,b)=>b.sum-a.sum);
    out.push(`Родным отправила <b>${money(fam)}${NBSP}${U}</b>, ${Math.round(fam/st.spend*100)}% всех трат${R.length>1||R[0]&&R[0].n!==catName('family')?': '+R.slice(0,4).map(r=>esc(r.n)+' '+money(r.sum)).join(', '):''}.`);}
  const nameless=st.txs.filter(t=>!t.ex&&t.a<0&&CORE.isGeneric(t)&&catOf(t).rv);
  if(nameless.length){const sum=nameless.reduce((x,t)=>x-val(t),0);out.push(`Переводов без имени: ${nameless.length} на ${money(sum)}${NBSP}${U}. Отметь, какие из них родным, и будет видно, кому сколько.`);}
  const eat=(st.by.cafe||0)+(st.by.delivery||0)+(st.by.coffee||0),gr=st.by.groceries||0;
  if(eat>0&&gr>0)out.push(`Еда вне дома (кафе, доставка, кофе): <b>${money(eat)}${NBSP}${U}</b>, продукты: ${money(gr)}${NBSP}${U}.${eat>gr*1.2?' Готовая еда обходится дороже продуктов.':''}`);
  let top=null;CATS.filter(c=>c.kind==='spend').forEach(c=>Object.values(st.merch[c.id]||{}).forEach(m=>{if(m.cnt>=3&&(!top||m.cnt>top.cnt))top=m;}));
  if(top)out.push(`Чаще всего: <b>${esc(top.n)}</b>, ${top.cnt} ${pl(top.cnt,'раз','раза','раз')} на ${money(top.sum)}${NBSP}${U}.`);
  const big=st.txs.filter(t=>!t.ex&&t.a<0&&kindOf(t)==='spend').sort((a,b)=>val(a)-val(b))[0];
  if(big&&-val(big)>=st.spend*0.08)out.push(`Самая крупная трата: ${esc(titleOf(big))}, ${money(-val(big))}${NBSP}${U}, ${fD(big.date)}.`);
  if(st.earn>0)out.push(`Потрачено ${Math.round(st.spend/st.earn*100)}% от заработанного за этот срок.`);

  <p class="gtitle" style="margin-top:14px">Цвет</p><div class="pal">${PAL.map(c=>`<button class="${c===newCatColor?'on':''}" data-act="ncColor" data-v="${c}" style="background:${c}" aria-label="Цвет ${c}"></button>`).join('')}</div>
  <button class="primary" style="margin-top:16px" data-act="ncSave">Создать</button>`;
}

/* ---------- IMPORT ---------- */
/* the PDF reader ships with the app and is loaded on first use; with pdf.worker in the page it runs without a separate worker */
let pdfP=null;
function loadJS(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('nolib'));document.head.appendChild(s);});}
function pdfLib(){
  if(!pdfP)pdfP=(async()=>{
    if(!window.pdfjsLib)await loadJS('pdf.min.js');
    if(!window.pdfjsWorker)await loadJS('pdf.worker.min.js');
    const L=window.pdfjsLib;if(!L)throw new Error('nolib');try{L.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';}catch(_){}return L;
  })().catch(e=>{pdfP=null;throw e;});
  return pdfP;
}
async function readPages(buf){
  const L=await pdfLib();
  const doc=await L.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;const out=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1});const tc=await pg.getTextContent();
    out.push({h:vp.height,items:tc.items.map(i=>({x:i.transform[4],y:vp.height-i.transform[5],w:i.width,str:i.str}))});}
  try{doc.destroy();}catch(_){}
  return out;
}
function pagesToText(pages){
  return pages.map((pg,pi)=>{const its=pg.items.filter(i=>i.str&&i.str.trim()).sort((a,b)=>a.y-b.y||a.x-b.x);const lines=[];
    its.forEach(i=>{const L=lines[lines.length-1];if(L&&Math.abs(L.y-i.y)<3)L.items.push(i);else lines.push({y:i.y,items:[i]});});
    return '--- стр. '+(pi+1)+' ---\n'+lines.map(L=>{L.items.sort((a,b)=>a.x-b.x);let s='',px=null;L.items.forEach(i=>{if(px!=null)s+=(i.x-px>12?' | ':' ');s+=i.str.trim();px=i.x+i.w;});return s;}).join('\n');});
}
function normBank(b){const k=b.toLowerCase().split(/\s+/)[0];const ex=S.meta.imports.map(i=>i.bank).find(x=>x.toLowerCase().split(/\s+/)[0]===k);return ex||b;}
function mergeImport(res){
  const [p0,p1]=res.period,bank=res.by==='ai'?normBank(res.bank):res.bank;
  const occ={};
  const rows=res.rows.filter(r=>r.date>=p0&&r.date<=p1).map(r=>{const o={bank,date:r.date,a:r.a,cur:r.cur||'KZT',op:r.op||'',desc:r.desc};if(r.ai)o.ai=r.ai;if(r.ai)o.sure=r.sure;
    const k=bank+'|'+o.date+'|'+o.a+'|'+CORE.keyOf(o.desc);occ[k]=(occ[k]||0)+1;o.id=CORE.hash(k+'|'+occ[k]);return o;});
  const pool=allTx().filter(t=>t.date>=p0&&t.date<=p1&&t.bank!=='вручную');const used=new Set();let kept=0;
  rows.forEach(n=>{let best=null,bs=-1;
    pool.forEach(o=>{if(used.has(o)||o.cur!==n.cur||Math.abs(o.a-n.a)>0.005)return;const dif=Math.abs(dd(o.date,n.date));if(dif>2)return;const sc=(CORE.keyOf(o.desc)===CORE.keyOf(n.desc)?10:0)+(o.bank===n.bank?5:0)-dif;if(sc>bs){bs=sc;best=o;}});
    if(best&&(bs>=3||best.bank===n.bank)){used.add(best);kept++;n.id=best.id;['mc','note','ex'].forEach(k=>{if(best[k])n[k]=best[k];});if(!n.ai&&best.ai){n.ai=best.ai;n.sure=best.sure;n.why=best.why;}}});
  const drop=new Set(pool.filter(o=>used.has(o)||o.bank===bank).map(o=>o.id));
  for(const m in S.tx)S.tx[m]=S.tx[m].filter(t=>!drop.has(t.id));
  const ids=new Set(allTx().map(t=>t.id));
  rows.forEach(n=>{while(ids.has(n.id))n.id=n.id+'x';ids.add(n.id);const m=n.date.slice(0,7);(S.tx[m]=S.tx[m]||[]).push(n);});
  S.meta.imports.push({bank,period:[p0,p1],n:rows.length,at:today(),by:res.by||'local',check:res.check?{ok:res.check.ok}:null});
  if(S.meta.imports.length>40)S.meta.imports=S.meta.imports.slice(-40);
  return {n:rows.length,newN:rows.length-kept,ids:rows.map(r=>r.id)};
}
async function importFiles(files){
  if(impBusy)return;impBusy=true;impLog=[];const fresh=[];
  const rr=()=>{if(sheet)renderSheet();else render();};
  const bad=(line,msg)=>{line.cls='bad';line.html=esc(line.name)+': <b>'+msg+'</b>';};
  for(const f of files){
    const line={name:f.name,cls:'',html:esc(f.name)+': читаю…'};impLog.push(line);rr();
    try{
      const isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
      if(!isPdf){bad(line,'нужен PDF. В приложении Kapitalbank и Kaspi выписку можно скачать в PDF');rr();continue;}
      const pages=await readPages(await f.arrayBuffer()),all=pagesToText(pages).join(' ');let res=null;
      if(all.includes('Капиталбанк')||/kapital ?bank/i.test(all)){const k=CORE.parseKapital(pages);if(k.rows.length&&k.period)res=Object.assign(k,{by:'local'});}
      if(!res){const loc=CORE.parseStatement(pages);if(loc&&!loc.error&&loc.rows&&loc.rows.length&&loc.period){res=Object.assign(loc,{bank:loc.bank==='kaspi'?'Kaspi':'Freedom',by:'local'});res.rows.forEach(r=>{r.cur='KZT';});}}
      if(!res){bad(line,!all.replace(/--- стр\. \d+ ---/g,'').trim()?'в файле нет текста. Если это скан или фото, скачай выписку заново в PDF из приложения банка':'этот банк пока не читается. Подходят выписки Kapitalbank и Kaspi в PDF');rr();continue;}
      const r=mergeImport(res);fresh.push(...r.ids);
      line.cls=res.check?(res.check.ok?'ok':'bad'):'ok';
      line.html=`${esc(res.bank)}, ${fDs(res.period[0])}-${fDs(res.period[1])}: <b>новых ${r.newN}</b>, уже было ${r.n-r.newN}${res.check?(res.check.ok?'. Суммы сходятся с итогами выписки':'. Суммы не сошлись с итогами выписки'):''}`;
      bump();month=null;commit();rr();
    }catch(e){console.warn(e);bad(line,e&&e.message==='nolib'?'не загрузился модуль чтения PDF. Открой приложение один раз с интернетом и попробуй снова':e&&e.name==='PasswordException'?'файл защищён паролем, скачай выписку без пароля':'не получилось прочитать файл');}
    rr();
  }
  impBusy=false;bump();month=null;commit();rr();
  const unk=fresh.map(findTx).filter(t=>t&&!t.ex&&catOf(t).rv).length;
  toast(unk?`Готово. Разобрать: ${unk} ${pl(unk,'операция','операции','операций')}`:'Готово');
}

/* ---------- sheet / toast / render ---------- */
function openSheet(k,v){sheet={k,v};renderSheet();$('#sheet').hidden=false;$('.panel').scrollTop=0;document.body.style.overflow='hidden';}
function closeSheet(){sheet=null;pick=null;exportText='';draft={};sheetBack=null;armed=null;restoreP=null;newCatColor=null;$('#sheet').hidden=true;document.body.style.overflow='';render();}
function renderSheet(){
  if(!sheet)return;const st=$('.panel').scrollTop;let top='',body='';
  if(sheet.k==='tx'){const t=findTx(sheet.v);if(!t){closeSheet();return;}body=txSheet(t,false);}
  else if(sheet.k==='review'){const t=findTx(reviewQ[reviewI]);if(!t){nextReview();return;}top=`Разбираем: ${reviewI+1} из ${reviewQ.length}`;body=txSheet(t,true);}
  else if(sheet.k==='settings')body=settingsSheet();
  else if(sheet.k==='exp')body=expSheet();
  else if(sheet.k==='cat')body=catSheet(sheet.v);
  else if(sheet.k==='manual')body=manualSheet();
  else if(sheet.k==='restore')body=restoreSheet();
  else if(sheet.k==='newcat')body=newCatSheet();
  else if(sheet.k==='ask')body=askSheet();
  $('#sheetTop').textContent=top;$('#sheetBody').innerHTML=body;$('.panel').scrollTop=st;
}
function toast(msg,fn){const t=$('#toast');undo=fn||null;t.innerHTML=esc(msg)+(fn?' <button data-act="undo">Вернуть</button>':'');t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('show');undo=null;},fn?4500:2200);}
function render(){
  $('#view').innerHTML=({sum:sumHTML,ops:opsHTML,inc:incHTML})[tab]();
  $$('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  let rv=0;if(allTx().length){const r=range();rv=txIn(r[0],r[1]).filter(t=>!t.ex&&catOf(t).rv).length;}
  const ob=$('#tabs [data-tab=ops]');const p=ob.querySelector('.pip');if(p)p.remove();if(rv)ob.insertAdjacentHTML('beforeend',`<span class="pip">${rv}</span>`);
}
function keepDraft(){const n=$('#noteIn'),al=$('#aliasIn');if(n)draft.note=n.value;if(al)draft.alias=al.value;}
const numOf=v=>{const x=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));return isNaN(x)?0:x;};

/* ---------- events ---------- */
const A={
  tab(v){if(sheet)closeSheet();tab=v;render();window.scrollTo(0,0);},
  mon(v){const ms=months(),i=ms.indexOf(curMonth())+Number(v);if(ms[i]){month=ms[i];render();}},
  per(v){per=v;render();},
  curT(){ST().main=MAIN()==='UZS'?'KZT':'UZS';bump();commit();toast('Суммы в '+(MAIN()==='UZS'?'сумах':'тенге'));},
  toCats(){const e=$('#cats');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});},
  cat(v){openSheet('cat',v);},
  day(v){opsDay=v||null;tab='ops';render();window.scrollTo(0,0);},
  opsCat(v){opsFilter=v||null;if(sheet)closeSheet();tab='ops';render();window.scrollTo(0,0);},
  intT(v,el){showInternal=el.checked;render();},
  flexT(v,el){S.meta.flex=S.meta.flex||{};S.meta.flex[v]=el.checked?1:0;commit();renderSheet();},
  exT(v,el){const t=findTx(v);if(!t)return;if(el.checked)t.ex=true;else delete t.ex;bump();commit();renderSheet();toast(el.checked?'Не считается в тратах':'Снова считается');},
  tx(v){pick=null;draft={};openSheet('tx',v);},
  pick(v){keepDraft();pick=v;renderSheet();},
  who(v){const i=$('#noteIn');if(i)i.value=v;draft.note=v;$$('[data-act=who]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));},
  saveOne(v){saveTx(v,false);},saveAll(v){saveTx(v,true);},skip(){nextReview();},review(){startReview();},
  resetTx(v){const t=findTx(v);if(t){delete t.mc;bump();commit();pick=null;renderSheet();toast('Категория снова по правилам');}},
  delRule(v){const r=S.meta.rules[v];if(!r)return;delete S.meta.rules[v];bump();commit();if(sheet){pick=null;renderSheet();}toast('Правило забыто',()=>{S.meta.rules[v]=r;bump();commit();if(sheet)renderSheet();});},
  delTx(v){for(const m in S.tx){const i=S.tx[m].findIndex(x=>x.id===v);if(i>=0){const t=S.tx[m].splice(i,1)[0];closeSheet();commit();toast('Удалено',()=>{S.tx[m].splice(i,0,t);commit();});return;}}},
  ask(){openSheet('ask');},
  askCopy(){copyText(askPrompt(),'Скопировано. Открой Claude и вставь',$('#askTxt'));},
  restoreOpen(){restoreP=null;openSheet('restore');},
  bkApply(){if(!restoreP)return;setLastBackup(restoreP.at||Date.now());applyRestore(restoreP.s,'Восстановлено: '+restoreP.n+' '+pl(restoreP.n,'операция','операции','операций'));},
  snapRestore(v){if(armed!=='snap:'+v){armed='snap:'+v;renderSheet();return;}armed=null;
    let d=null;try{d=JSON.parse(readLS(SNAP+v));}catch(_){}if(!validState(d)){toast('Эта копия испорчена');return;}
    applyRestore(d,'Вернула как было '+(v===today()?'сегодня утром':fD(v)));},
  newCat(){keepDraft();if(sheet&&sheet.k!=='settings'&&sheet.k!=='newcat')sheetBack={k:sheet.k,v:sheet.v,pick};else if(sheet&&sheet.k==='settings')sheetBack={k:'settings'};newCatColor=null;draft.ncName='';openSheet('newcat');},
  ncColor(v){newCatColor=v;$$('[data-act=ncColor]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));},
  ncSave(){const i=$('#ncName'),name=(i?i.value:'').trim().replace(/\s+/g,' ');if(!name){toast('Напиши название');return;}
    if(CATS.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Такая категория уже есть');return;}
    const c={id:'u'+Date.now().toString(36),name,color:newCatColor||PAL[0]};S.meta.cats.push(c);CORE.setCustom(S.meta.cats);bump();commit();
    const back=sheetBack;sheetBack=null;delete draft.ncName;
    if(back&&back.k!=='settings'){pick=c.id;sheet={k:back.k,v:back.v};renderSheet();$('.panel').scrollTop=0;}
    else if(back){sheet={k:'settings'};renderSheet();}else closeSheet();
    toast('Категория «'+name+'» создана');},
  delCat(v){if(armed!=='cat:'+v){armed='cat:'+v;renderSheet();return;}armed=null;
    const i=S.meta.cats.findIndex(c=>c.id===v);if(i<0)return;const cat=S.meta.cats[i];
    const mcs=allTx().filter(t=>t.mc===v),rules=Object.entries(S.meta.rules).filter(([,r])=>r.cat===v);
    S.meta.cats.splice(i,1);mcs.forEach(t=>delete t.mc);rules.forEach(([k])=>delete S.meta.rules[k]);CORE.setCustom(S.meta.cats);bump();commit();renderSheet();
    toast('Категория «'+cat.name+'» удалена',()=>{S.meta.cats.splice(Math.min(i,S.meta.cats.length),0,cat);mcs.forEach(t=>{t.mc=v;});rules.forEach(([k,r])=>{S.meta.rules[k]=r;});CORE.setCustom(S.meta.cats);bump();commit();if(sheet)renderSheet();});},
  manual(){pick=null;openSheet('manual');},
  mnSave(){const a=numOf($('#mnA').value);if(!(a>0)){toast('Впиши сумму');return;}const d=$('#mnD').value||today(),c=$('#mnC').value,n=$('#mnN').value.trim()||'Наличные';
    const t={id:'m'+Date.now().toString(36),bank:'вручную',date:d,a:-a,cur:c,op:'Вручную',desc:n,mc:pick||'other'};(S.tx[d.slice(0,7)]=S.tx[d.slice(0,7)]||[]).push(t);bump();closeSheet();commit();toast('Добавлено');},
  expAdd(){openSheet('exp');},
  expSave(){const t=$('#exT').value.trim();if(!t){toast('Напиши, что ждёшь');return;}const e={id:'e'+Date.now().toString(36),t,cur:MAIN()};const d=$('#exD').value;if(d)e.date=d;const a=numOf($('#exA').value);if(a>0)e.amt=a;S.meta.expect.push(e);commit();closeSheet();toast('Добавлено');},
  expDone(v){const i=S.meta.expect.findIndex(e=>e.id===v);if(i<0)return;const e=S.meta.expect.splice(i,1)[0];commit();toast('Убрано из ожидаемых',()=>{S.meta.expect.splice(i,0,e);commit();});},
  settings(){exportText='';openSheet('settings');},
  export(){doExport();},
  copyOut(){const ta=$('#outTxt');if(!ta)return;copyText(ta.value,'Скопировано. Сохрани в Заметки',ta);setLastBackup(Date.now());},
  close(){if(sheet&&sheet.k==='newcat'&&sheetBack){const b=sheetBack;sheetBack=null;delete draft.ncName;if(b.k!=='settings')pick=b.pick;sheet={k:b.k,v:b.v};renderSheet();return;}closeSheet();},
  undo(){const f=undo;undo=null;$('#toast').classList.remove('show');if(f)f();}
};
document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');if(tb){A.tab(tb.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='INPUT'&&el.type!=='checkbox')return;
  const f=A[el.dataset.act];if(f)f(el.dataset.v,el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pdfIn'&&el.files&&el.files.length){const fs=Array.from(el.files);el.value='';if(allTx().length&&(!sheet||sheet.k!=='settings'))openSheet('settings');importFiles(fs);return;}
  if(el.id==='bkIn'&&el.files&&el.files[0]){const f=el.files[0];el.value='';const r=new FileReader();r.onload=()=>{restoreP=parseBackup(r.result);if(!restoreP){toast('Это не похоже на бэкап «Расходов»');}renderSheet();};r.onerror=()=>toast('Не получилось открыть файл');r.readAsText(f);return;}
  if(el.dataset.catname){const c=S.meta.cats.find(x=>x.id===el.dataset.catname),v=el.value.trim().replace(/\s+/g,' ');if(!c)return;
    if(!v||CATS.some(x=>x.id!==c.id&&x.name.toLowerCase()===v.toLowerCase())){el.value=c.name;toast(v?'Такая категория уже есть':'Название не может быть пустым');return;}
    c.name=v;CORE.setCustom(S.meta.cats);bump();commit();toast('Переименовала');return;}
  if(el.id==='aboutIn'){S.meta.about=el.value.trim();commit();toast('Сохранено');return;}
  if(el.dataset.guide){const c=el.dataset.guide,v=numOf(el.value);S.meta.guidesU=S.meta.guidesU||{};S.meta.guidesU[c]=v>0?toUZS(v):0;commit();renderSheet();return;}
  if(el.dataset.rate){const v=numOf(el.value);if(v>0){ST().uzs[el.dataset.rate]=v;bump();commit();}return;}
  const k=el.dataset.set;if(k){
    if(k==='main'){ST().main=el.value;}
    else if(k==='smallMax'){ST().smallUZS=toUZS(numOf(el.value));}
    else if(k==='ownNames'){ST().ownNames=el.value.split(',').map(x=>x.trim()).filter(Boolean);}
    bump();commit();renderSheet();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='bkTxt'){const v=e.target.value.trim();restoreP=v?parseBackup(v):null;const sm=$('#bkSum'),bd=$('#bkBad'),btn=$('[data-act=bkApply]');
    if(sm){sm.hidden=!restoreP;sm.innerHTML=backupSummary(restoreP);}if(bd)bd.hidden=!(v&&!restoreP);if(btn)btn.disabled=!restoreP;return;}
  if(e.target.id==='ncName'){draft.ncName=e.target.value;return;}
  if(e.target.id==='opsQ'){opsQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#opsQ');if(i){i.focus();try{i.setSelectionRange(pos,pos);}catch(_){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet();});
/* left open overnight: take today's copy when she comes back */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){snapshotDaily();if(!sheet)render();}});
saveLocal();render();initApp();
window.__rs={get S(){return S;},CORE};
})();
